# Reglas declarativas de validación y consolidación de planillas
columnas_requeridas:
  - legajo
  - empleado
  - sector
  - fecha
  - turno
  - horas_trabajadas

# Clave compuesta para detección de registros duplicados
clave_unicidad:
  - legajo
  - fecha

# Validaciones de dominio y rango
validaciones:
  horas_trabajadas:
    tipo: numeric
    min: 0.5
    max: 12.0
  horas_extra:
    tipo: numeric
    min: 0.0
    max: 8.0
    permite_vacio: true
  turnos_permitidos:
    - Mañana
    - Tarde
    - Noche
    - Rotativo

